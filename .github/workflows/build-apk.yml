name: build-apk

on:
  push:
    branches: [haijiao-shell-android]
    paths-ignore:
      - 'dist/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          java -version 2>&1 | head -3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 补齐 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: 构建 debug APK
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../dist
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../dist/build.log

      - name: 归档
        if: always()
        run: |
          mkdir -p dist
          if ls android/app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            cp android/app/build/outputs/apk/debug/*.apk dist/haijiao-shell.apk
            sha256sum dist/haijiao-shell.apk | tee dist/haijiao-shell.apk.sha256
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haijiao-shell-apk
          path: |
            dist/haijiao-shell.apk
            dist/build.log
          if-no-files-found: warn

      - name: 模拟器冒烟测试（手动起机，输出全落盘）
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p dist
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          {
            echo "== SDK 布局 =="; ls "$ANDROID_HOME" 2>/dev/null; ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null
            echo "== 工具 =="; which sdkmanager avdmanager emulator adb; adb version
            echo "== KVM =="; ls -l /dev/kvm; sudo chmod 666 /dev/kvm 2>/dev/null || true
            echo "== 安装系统镜像 =="
            yes | sdkmanager --licenses >/dev/null 2>&1
            sdkmanager "platform-tools" "emulator" "system-images;android-30;default;x86_64" 2>&1 | tail -3
            echo "== 创建 AVD =="
            export ANDROID_USER_HOME="$HOME/.android"
            export ANDROID_AVD_HOME="$HOME/.android/avd"
            mkdir -p "$ANDROID_AVD_HOME"
            echo no | avdmanager create avd -n smoke -k "system-images;android-30;default;x86_64" -d pixel_2 --force 2>&1 | tail -3
            echo "-- AVD 目录 --"; ls -la "$ANDROID_AVD_HOME" 2>/dev/null
            echo "-- avdmanager list --"; avdmanager list avd 2>&1 | head -12
            echo "-- 全盘找 avd --"; find "$HOME" /root /usr/local/lib/android -maxdepth 5 -name "*.avd" -o -maxdepth 5 -name "smoke.ini" 2>/dev/null | head -10
            echo "== 启动模拟器 =="
            export ANDROID_AVD_HOME="$HOME/.android/avd"
            export ANDROID_USER_HOME="$HOME/.android"
            nohup env ANDROID_AVD_HOME="$ANDROID_AVD_HOME" ANDROID_USER_HOME="$ANDROID_USER_HOME" \
              "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
              -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2 > dist/emulator.log 2>&1 &
            EMU_PID=$!
            echo "emulator pid=$EMU_PID"
            sleep 20
            for i in $(seq 1 90); do
              if ! kill -0 $EMU_PID 2>/dev/null; then echo "[!] 模拟器进程已退出（第 $i 轮）"; break; fi
              b=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$b" = "1" ]; then echo "[+] 开机完成（第 $i 轮，约 $((i*5+20)) 秒）"; break; fi
              [ $((i % 12)) -eq 0 ] && echo "  ...等待中 $i（boot_completed='$b'）"
              sleep 5
            done
            echo "== 模拟器日志尾 =="; tail -25 dist/emulator.log
            echo "== 设备 =="; timeout 60 adb devices
            boot=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot" != "1" ]; then echo "[!] 模拟器未就绪，跳过装机"; ls -la dist; exit 0; fi
            echo "== 装机 =="
            timeout 60 adb logcat -c 2>/dev/null
            timeout 180 adb install -r -t dist/haijiao-shell.apk
            echo "== 启动（首页） =="
            timeout 60 adb shell am start -W -n com.haijiao.shell/.MainActivity
            sleep 60
            timeout 60 adb exec-out screencap -p > dist/smoke-01-home.png
            echo "== 打开视频播放页 =="
            timeout 60 adb shell am start -W -n com.haijiao.shell/.MainActivity --es url "https://haijiao.com/video/watch?id=9624"
            sleep 60
            timeout 60 adb exec-out screencap -p > dist/smoke-02-watch.png
            echo "== 增强层验证：直接打开一个 mp4（满屏 video 元素）=="
            timeout 60 adb shell am start -W -n com.haijiao.shell/.MainActivity --es url "https://www.w3schools.com/html/mov_bbb.mp4"
            sleep 45
            timeout 60 adb exec-out screencap -p > dist/smoke-03-mp4.png
            echo "== 盲点工具条按钮（估算坐标，每次点完截图）=="
            for pt in "950 300" "900 300" "1000 300"; do
              set -- $pt
              echo "-- tap $1 $2"
              timeout 30 adb shell input tap $1 $2
              sleep 10
              timeout 60 adb exec-out screencap -p > "dist/smoke-04-tap-$1-$2.png"
            done
            echo "== 全屏日志 =="
            timeout 60 adb logcat -d -v time > dist/smoke-logcat.txt
            grep -a "全屏" dist/smoke-logcat.txt | tail -10
            echo "== hj-shell =="
            grep -a "hj-shell" dist/smoke-logcat.txt | tail -40
            echo "== 页面 =="
            grep -aE "\[页面\]|海角" dist/smoke-logcat.txt | tail -30
            echo "== 崩溃 =="
            grep -aE "FATAL EXCEPTION|ANR in" dist/smoke-logcat.txt | head -10
          } 2>&1 | tee dist/smoke-report.txt
          ls -la dist

      - name: 回传产物与构建日志（方便无 token 取回）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ 2>/dev/null || true
          git commit -m "build: $(date -u +%Y%m%d-%H%M%S) 结论=${{ job.status }} [skip ci]" || echo "no change"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || echo "push skipped"
