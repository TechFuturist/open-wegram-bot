name: build-apk

on:
  push:
    branches: [haijiao-shell-android]
    paths-ignore:
      - 'dist/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          java -version 2>&1 | head -3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 补齐 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: 构建 debug APK
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../dist
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../dist/build.log

      - name: 归档
        if: always()
        run: |
          mkdir -p dist
          if ls android/app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            cp android/app/build/outputs/apk/debug/*.apk dist/haijiao-shell.apk
            sha256sum dist/haijiao-shell.apk | tee dist/haijiao-shell.apk.sha256
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haijiao-shell-apk
          path: |
            dist/haijiao-shell.apk
            dist/build.log
          if-no-files-found: warn

      - name: 模拟器冒烟测试（装机 + 启动 + 截图 + 日志）
        if: always()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            adb logcat -c || true
            adb install -r dist/haijiao-shell.apk 2>&1 | tee dist/smoke-install.txt
            adb shell am start -n com.haijiao.shell/.MainActivity 2>&1 | tee dist/smoke-start.txt
            sleep 60
            adb exec-out screencap -p > dist/smoke-screenshot.png || true
            adb logcat -d -v time > dist/smoke-logcat.txt || true
            echo "===== hj-shell 日志 ====="
            grep -E "hj-shell" dist/smoke-logcat.txt | tail -40 || true
            echo "===== 页面/脚本日志 ====="
            grep -E "\[页面\]|海角" dist/smoke-logcat.txt | tail -30 || true
            echo "===== 崩溃 ====="
            grep -E "FATAL|AndroidRuntime|ANR" dist/smoke-logcat.txt | tail -20 || true
            ls -la dist

      - name: 回传产物与构建日志（方便无 token 取回）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ 2>/dev/null || true
          git commit -m "build: $(date -u +%Y%m%d-%H%M%S) 结论=${{ job.status }} [skip ci]" || echo "no change"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || echo "push skipped"
